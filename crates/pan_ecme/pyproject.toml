[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "pan_ecme"
version = "0.1.0"
description = "ECME kernels prelim, nopsi, ecme3 and bdiag of pan 2.0 compiled from src/pan.f"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "pan_ecme"
