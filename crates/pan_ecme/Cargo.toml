[workspace]

[package]
name = "pan_ecme"
version = "0.1.0"
edition = "2021"
description = "ECME kernels prelim, nopsi, ecme3 and bdiag of pan 2.0 (src/pan.f), compiled from the Fortran with gfortran and bound to Python"
publish = false
license = "GPL-3.0-only"

[lib]
name = "pan_ecme"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
