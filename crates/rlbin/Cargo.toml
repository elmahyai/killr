[package]
name = "rlbin"
version = "0.1.0"
edition = "2021"
description = "Regression linear binning ported from KernSmooth src/rlbin.f"
publish = false

[lib]
name = "rlbin"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
