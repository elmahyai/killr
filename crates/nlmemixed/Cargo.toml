[package]
name = "nlmemixed"
version = "0.1.0"
edition = "2021"
description = "nlme mixed-model and nonlinear mixed-model fit kernels"
publish = false
license = "GPL-2.0-only"

[lib]
name = "nlmemixed"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[build-dependencies]
cc = "1"

[workspace]
