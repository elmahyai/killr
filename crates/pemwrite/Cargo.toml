[package]
name = "pemwrite"
version = "0.1.0"
edition = "2021"
description = "PEM export from openssl src/write.c"
publish = false

[lib]
name = "pemwrite"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
openssl = "0.10"

[workspace]
