[package]
name = "goftest"
version = "0.1.0"
edition = "2021"
description = "Anderson-Darling kernels from goftest 1.2-3 src/AnDarl.c and src/ADinf.c"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "goftest_kernels"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[workspace]
