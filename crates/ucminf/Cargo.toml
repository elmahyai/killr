[workspace]

[package]
name = "ucminf"
version = "0.1.0"
edition = "2021"
description = "UCMINF quasi-Newton optimizer ported from ucminf src/fortran.f"
publish = false
license = "GPL-2.0-only"

[lib]
name = "ucminf"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
