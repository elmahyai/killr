[package]
name = "rowsums2"
version = "0.1.0"
edition = "2021"
description = "Row and column sums ported from matrixStats src/rowSums2.c"
publish = false

[workspace]

[lib]
name = "rowsums2"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
