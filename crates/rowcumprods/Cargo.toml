[package]
name = "rowcumprods"
version = "0.1.0"
edition = "2021"
description = "Row and column cumulative products ported from matrixStats src/rowCumprods.c"
publish = false

[workspace]

[lib]
name = "rowcumprods"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
