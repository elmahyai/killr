[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "rowcumprods"
version = "0.1.0"
description = "Row and column cumulative products ported from matrixStats src/rowCumprods.c"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "rowcumprods"
