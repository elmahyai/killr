[workspace]

[package]
name = "pan_mgibbs"
version = "0.1.0"
edition = "2021"
description = "Sampler kernels mgibbs and mgibbsbd of pan 2.0 (src/pan.f) ported to Rust, with the Fortran Park-Miller generator"
publish = false
license = "GPL-3.0-or-later"

[lib]
name = "pan_mgibbs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
