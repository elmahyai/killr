[package]
name = "locpol"
version = "0.1.0"
edition = "2021"
description = "Binned local polynomial fit ported from KernSmooth src/locpoly.f"
publish = false

[lib]
name = "locpol"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
linpack = { path = "../linpack" }
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
