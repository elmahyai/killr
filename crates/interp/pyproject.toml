[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "interp_kernels"
version = "0.1.0"
description = "Sweep-hull Delaunay triangulation kernel for the R package interp (tri.mesh)"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "interp_kernels"
