[workspace]

[package]
name = "interp"
version = "0.1.0"
edition = "2021"
description = "Sweep-hull Delaunay triangulation kernel from R package interp 1.1-6 (tri.mesh)"
publish = false
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "interp_kernels"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
