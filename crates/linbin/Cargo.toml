[package]
name = "linbin"
version = "0.1.0"
edition = "2021"
description = "Linear binning ported from KernSmooth src/linbin.f"
publish = false

[lib]
name = "linbin"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
