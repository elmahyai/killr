[package]
name = "allocmatrix"
version = "0.1.0"
edition = "2021"
description = "Allocate and fill a vector, matrix, or array from matrixStats src/allocMatrix2.c"
publish = false

# Own workspace so this crate can be built without editing the repo workspace.
[workspace]

[lib]
name = "allocmatrix"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
