[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "allocmatrix"
version = "0.1.0"
description = "Allocate and fill a vector, matrix, or array from matrixStats src/allocMatrix2.c"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "allocmatrix"
