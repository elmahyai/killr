[package]
name = "hexbin"
version = "0.1.0"
edition = "2021"
description = "hexbin 1.28.6 binning and erosion kernels ported from src/hbin.f, hcell.f, herode.f, hsm.f"
publish = false

[lib]
name = "hexbin_kernels"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[workspace]
