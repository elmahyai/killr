[workspace]

[package]
name = "dsumsl"
version = "0.1.0"
edition = "2021"
description = "PORT SUMSL unconstrained minimizer from tseries src/dsumsl.f"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "dsumsl"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
