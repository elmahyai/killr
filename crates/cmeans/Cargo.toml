[package]
name = "cmeans"
version = "0.1.0"
edition = "2021"
description = "Fuzzy c-means ported from e1071 src/cmeans.c"
publish = false

[lib]
name = "cmeans"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[workspace]
