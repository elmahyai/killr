[package]
name = "roman2int"
version = "0.1.0"
edition = "2021"
description = "Roman numeral conversion ported from gtools src/roman2int.c"
publish = false

[workspace]

[lib]
name = "roman2int"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
