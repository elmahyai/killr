[workspace]

[package]
name = "rlbfgsb"
version = "0.1.0"
edition = "2021"
description = "L-BFGS-B of R 4.5.0 optim(method = \"L-BFGS-B\"): a port of src/appl/lbfgsb.c, the optim driver, and the bounded numerical gradient, with a pyo3 binding"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "rlbfgsb"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
