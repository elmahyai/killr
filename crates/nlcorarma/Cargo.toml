[package]
name = "nlcorarma"
version = "0.1.0"
edition = "2021"
description = "nlme corStruct.c ARMA parameter reparameterization and ARMA correlation factor (unconstCoef, constCoef, factList, recalc)"
publish = false

[lib]
name = "nlcorarma"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
linpack = { path = "../linpack" }
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[workspace]
