[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "nlme_mixedem"
version = "0.1.0"
description = "nlme mixed_EM (EM iterations for lme) on the vendored nlme C and R LINPACK"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "nlme_mixedem"
