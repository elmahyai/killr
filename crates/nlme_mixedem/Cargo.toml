[package]
name = "nlme_mixedem"
version = "0.1.0"
edition = "2021"
description = "nlme mixed_EM (src/nlmefit.c, bit-exact with R) from the vendored nlme 3.1-171 C"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "nlme_mixedem"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[workspace]
