[package]
name = "gower"
version = "1.0.2"
edition = "2021"
description = "Gower's distance and top-n matches ported from gower 1.0.2 src/gower.c"
publish = false

[lib]
name = "gower_kernel"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
rayon = "1"
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

# Own workspace so this crate can be built without editing the repo workspace.
[workspace]
