[package]
name = "lsodes"
version = "0.1.0"
edition = "2021"
description = "deSolve LSODES integrator from opkdmain.f and dsparsk.f"
publish = false

[lib]
name = "lsodes"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[workspace]
