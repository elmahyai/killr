[package]
name = "indexbyrow"
version = "0.1.0"
edition = "2021"
description = "Row-major to column-major indexes ported from matrixStats src/indexByRow.c"
publish = false

[workspace]

[lib]
name = "indexbyrow"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
