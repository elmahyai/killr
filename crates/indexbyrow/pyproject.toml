[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "indexbyrow"
version = "0.1.0"
description = "Row-major to column-major indexes ported from matrixStats src/indexByRow.c"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "indexbyrow"
