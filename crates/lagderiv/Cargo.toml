[package]
name = "lagderiv"
version = "0.1.0"
edition = "2021"
description = "deSolve lagderiv history derivative lookup (lags.c getLagDeriv)"
publish = false

[lib]
name = "lagderiv"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[workspace]
