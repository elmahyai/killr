[package]
name = "product"
version = "0.1.0"
edition = "2021"
description = "Product via sum of logs, ported from matrixStats src/productExpSumLog.c"
publish = false

# This crate is built on its own. The workspace manifest is left unchanged.
[workspace]

[lib]
name = "product"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
