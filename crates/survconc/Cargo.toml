[workspace]

[package]
name = "survconc"
version = "0.1.0"
edition = "2021"
description = "Concordance counts from survival src/concordance1.c (Cconcordance1, Cconcordance2)"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "survconc"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
