[workspace]

[package]
name = "gnlsfit"
version = "0.1.0"
edition = "2021"
description = "Generalized nonlinear least squares from nlme src/gnls.c (fit_gnls)"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "gnlsfit"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
