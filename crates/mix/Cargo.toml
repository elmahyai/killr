[workspace]

[package]
name = "mix_kernel"
version = "0.1.0"
edition = "2021"
description = "Kernels of the R package mix 1.0-13 (src/mix.f): prelim, EM, data augmentation, imputation and the Park-Miller generator, compiled from the Fortran with gfortran and bound to Python"
publish = false

[lib]
name = "mix_kernel"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
