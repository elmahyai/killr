[package]
name = "nlmegls"
version = "0.1.0"
edition = "2021"
description = "nlme gls_loglik and gls_estimate, on the dqrdc2 QR"
publish = false

[lib]
name = "nlmegls"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[workspace]
