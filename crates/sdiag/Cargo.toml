[package]
name = "sdiag"
version = "0.1.0"
edition = "2021"
description = "Smoother-matrix diagonal ported from KernSmooth src/sdiag.f"
publish = false

[lib]
name = "sdiag"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

linpack = { path = "../linpack" }
