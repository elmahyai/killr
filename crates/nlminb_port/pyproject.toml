[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "nlminb_port"
version = "0.1.0"
description = "R 4.5.0 nlminb without gradient (PORT drmnf and drmnfb) on the portsrc.f kernel"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "nlminb_port"
