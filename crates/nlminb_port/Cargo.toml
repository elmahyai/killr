[package]
name = "nlminb_port"
version = "0.1.0"
edition = "2021"
description = "R 4.5.0 nlminb without gradient (PORT drmnf and drmnfb) on the portsrc.f kernel"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "nlminb_port"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[workspace]
