[package]
name = "pyears3b"
version = "0.1.0"
edition = "2021"
description = "Expected-survival pyears3b kernel from survival src/pyears3b.c"
publish = false

[lib]
name = "pyears3b"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[workspace]
