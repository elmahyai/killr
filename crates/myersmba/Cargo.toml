[workspace]

[package]
name = "myersmba"
version = "0.1.0"
edition = "2021"
description = "Myers shortest edit script ported from diffobj src/diff.c"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "myersmba"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
