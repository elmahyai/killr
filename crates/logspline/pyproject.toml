[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "logspline"
version = "2.1.22"
description = "Kernels of R package logspline 2.1.22 ported from src/lsdall.c, src/nlsd.c, and src/allpack.f"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "logspline"
