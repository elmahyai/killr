[workspace]

[package]
name = "logspline"
version = "2.1.22"
edition = "2021"
description = "Kernels of R package logspline 2.1.22 (logcensor, nlogcensor, nlogcensorx, rpqlsd) remade in Rust from src/lsdall.c, src/nlsd.c, and src/allpack.f"
publish = false
license = "Apache-2.0"

[lib]
name = "logspline"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
