[workspace]

[package]
name = "isoband"
version = "0.3.0"
edition = "2021"
description = "isolines, isobands, and clip_lines ported from isoband 0.3.0 src/isoband.cpp, polygon.cpp, and clip-lines.cpp"
publish = false

[lib]
name = "isoband_kernel"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
