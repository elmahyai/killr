[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "isoband-kernel"
version = "0.3.0"
description = "isolines, isobands, and clip_lines kernel ported from isoband 0.3.0 C++"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "isoband_kernel"
