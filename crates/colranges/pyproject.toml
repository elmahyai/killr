[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "colranges"
version = "0.1.0"
description = "Column minima, maxima, and ranges ported from matrixStats src/colRanges.c"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "colranges"
