[package]
name = "ccl4model"
version = "0.1.0"
edition = "2021"
description = "CCl4 inhalation model derivatives ported from deSolve src/ex_CCL4model.c"
publish = false

[lib]
name = "ccl4model"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[workspace]
