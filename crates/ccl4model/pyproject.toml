[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "ccl4model"
version = "0.1.0"
description = "CCl4 inhalation model derivatives ported from deSolve src/ex_CCL4model.c"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "ccl4model"
