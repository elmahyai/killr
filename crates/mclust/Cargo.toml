[package]
name = "mclust"
version = "0.1.0"
edition = "2021"
description = "mclust EM, E-step, M-step, density, and hierarchical clustering kernels"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "mclust_kernels"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[workspace]
