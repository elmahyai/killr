[workspace]

[package]
name = "deldir"
version = "0.1.0"
edition = "2021"
description = "Delaunay triangulation kernels (binsrt, master, intri) ported from deldir 2.0-4 src/*.f90"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "deldir"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
