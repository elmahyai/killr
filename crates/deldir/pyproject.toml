[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "deldir-engine"
version = "0.1.0"
description = "deldir 2.0-4 Delaunay triangulation kernels ported from Fortran 90"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "deldir_engine"
