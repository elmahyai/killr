[package]
name = "svmwrite"
version = "0.1.0"
edition = "2021"
description = "LIBSVM model export from e1071 Rsvm.c svmwrite"
publish = false

[lib]
name = "svmwrite"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[build-dependencies]
cc = "1"

[workspace]
