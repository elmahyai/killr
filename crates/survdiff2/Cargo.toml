[package]
name = "survdiff2"
version = "0.1.0"
edition = "2021"
description = "Log-rank and G-rho statistics from survival src/survdiff2.c"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "survdiff2"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[workspace]
