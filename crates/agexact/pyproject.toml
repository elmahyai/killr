[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "agexact"
version = "0.1.0"
description = "Andersen-Gill exact Cox partial likelihood ported from survival agexact.c and agmart.c"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "agexact"
