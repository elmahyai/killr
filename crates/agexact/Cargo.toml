[workspace]

[package]
name = "agexact"
version = "0.1.0"
edition = "2021"
description = "Andersen-Gill exact Cox partial likelihood from survival src/agexact.c and src/agmart.c"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "agexact"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
