[package]
name = "ecdhdh"
version = "0.1.0"
edition = "2021"
description = "EVP_PKEY_derive from openssl src/diffie.c"
publish = false

[lib]
name = "ecdhdh"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
openssl = "0.10"
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[workspace]
