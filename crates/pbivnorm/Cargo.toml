[workspace]

[package]
name = "pbivnorm"
version = "0.1.0"
edition = "2021"
description = "Standard bivariate normal CDF from pbivnorm 0.6.0 src/pbivnorm.f (Genz MVTDSTPACK and Kenkel PBIVNORM driver)"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "pbivnorm"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
