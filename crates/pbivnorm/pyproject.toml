[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "pbivnorm"
version = "0.1.0"
description = "Standard bivariate normal CDF ported from pbivnorm 0.6.0 Fortran (src/pbivnorm.f)"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "pbivnorm"
