[package]
name = "sstdiag"
version = "0.1.0"
edition = "2021"
description = "SS^T diagonal ported from KernSmooth src/sstdiag.f"
publish = false

[lib]
name = "sstdiag"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

linpack = { path = "../linpack" }
