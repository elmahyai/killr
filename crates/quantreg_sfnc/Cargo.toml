[workspace]

[package]
name = "quantreg_sfnc_kernel"
version = "0.1.0"
edition = "2021"
description = "Constrained sparse Frisch-Newton kernel (srqfnc with slpfnc) of R package quantreg 6.1, ported from src/srqfnc.f, with a pyo3 binding"
publish = false
license = "GPL-3.0-or-later"

[lib]
name = "quantreg_sfnc_kernel"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
