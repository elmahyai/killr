[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "quantreg_penalty_kernel"
version = "0.1.0"
description = "Triogram penalty matrix of R package quantreg 6.1 (penalty.f) ported to Rust"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "quantreg_penalty_kernel"
