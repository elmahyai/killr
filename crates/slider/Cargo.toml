[package]
name = "slider"
version = "0.1.0"
edition = "2021"
description = "slider 0.3.3 window kernels ported from src/segment-tree.c, src/summary-core.h, src/summary-slide.c, and src/summary-index.c"
publish = false

[lib]
name = "slider_kernels"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[workspace]
