[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "slider"
version = "0.1.0"
description = "slider 0.3.3 window kernels (segment tree, sum, prod, mean, min, max, all, any)"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "slider_kernels"
