[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "quantreg_br_kernel"
version = "0.1.0"
description = "Barrodale-Roberts parametric process of R package quantreg 6.1 (rqbr.f) ported to Rust"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "quantreg_br_kernel"
