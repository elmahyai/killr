[workspace]

[package]
name = "quantreg_br_kernel"
version = "0.1.0"
edition = "2021"
description = "Barrodale-Roberts parametric process (rq.fit.br with tau outside [0,1]) of R package quantreg 6.1, ported from src/rqbr.f, with a pyo3 binding"
publish = false
license = "GPL-3.0-or-later"

[lib]
name = "quantreg_br_kernel"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
