[package]
name = "nlme_pdsymm"
version = "0.1.0"
edition = "2021"
description = "R nlme matrixLog_pd (pdSymm factor) on the EISPACK rs.f kernel"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "nlme_pdsymm"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[workspace]
