[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "rowcummaxs"
version = "0.1.0"
description = "Row and column cumulative maxima ported from matrixStats src/rowCummaxs.c"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "rowcummaxs"
