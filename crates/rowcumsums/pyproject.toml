[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "rowcumsums"
version = "0.1.0"
description = "Cumulative row and column sums ported from matrixStats src/rowCumsums.c"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "rowcumsums"
