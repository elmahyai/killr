[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "sass-kernel"
version = "0.1.0"
description = "libsass C++ Sass compiler wrapped from Rust (sass 0.4.10 compile path)"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "sass_kernel"
