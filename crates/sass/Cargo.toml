[package]
name = "sass"
version = "0.1.0"
edition = "2021"
description = "libsass C++ Sass compiler, wrapped from Rust for the R package sass 0.4.10"
publish = false

[lib]
name = "sass_kernel"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[build-dependencies]
cc = "1"

[workspace]
