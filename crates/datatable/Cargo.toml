[package]
name = "datatable"
version = "0.1.0"
edition = "2021"
description = "between ported from data.table src/between.c"
publish = false

[lib]
name = "datatable_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

# Own workspace so this crate can be built without editing the repo workspace.
[workspace]
