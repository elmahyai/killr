[workspace]

[package]
name = "readxls"
version = "0.1.0"
edition = "2021"
description = "xls reader ported from readxl src/libxls and src/XlsCell.h"
publish = false
license = "MIT"

[lib]
name = "readxls"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
