[package]
name = "farver"
version = "2.1.2"
edition = "2021"
description = "Colour-space kernels from farver 2.1.2 src/ColorSpace.cpp, Conversion.cpp, Comparison.cpp"
publish = false

[lib]
name = "farver"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[build-dependencies]
cc = "1"

[workspace]
