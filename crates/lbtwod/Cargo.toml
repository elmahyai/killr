[package]
name = "lbtwod"
version = "0.1.0"
edition = "2021"
description = "Bivariate linear binning ported from KernSmooth src/linbin2D.f"
publish = false

[lib]
name = "lbtwod"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

