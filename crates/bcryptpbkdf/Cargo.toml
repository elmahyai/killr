[package]
name = "bcryptpbkdf"
version = "0.1.0"
edition = "2021"
description = "bcrypt_pbkdf from openssl src/bcrypt"
publish = false

[lib]
name = "bcryptpbkdf"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[build-dependencies]
cc = "1"

[workspace]
