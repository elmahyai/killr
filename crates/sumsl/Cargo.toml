[package]
name = "sumsl"
version = "0.1.0"
edition = "2021"
description = "PORT SUMSL and tseries GARCH kernel from tseries src/dsumsl.f and garch.c"
publish = false

[lib]
name = "sumsl"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[workspace]
