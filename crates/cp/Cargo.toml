[package]
name = "cp"
version = "0.1.0"
edition = "2021"
description = "Mallows Cp for blocked polynomial fits ported from KernSmooth src/cp.f"
publish = false

[lib]
name = "cp"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
linpack = { path = "../linpack" }
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

