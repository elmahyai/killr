[workspace]

[package]
name = "survfitkm"
version = "0.1.0"
edition = "2021"
description = "Kaplan–Meier and Fleming–Harrington counts from survival src/survfitkm.c (Csurvfitkm)"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "survfitkm"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
