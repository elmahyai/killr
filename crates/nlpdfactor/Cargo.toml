[package]
name = "nlpdfactor"
version = "0.1.0"
edition = "2021"
description = "nlme pdMat.c square-root factor kernels (logChol, matrixLog, natural, compSymm)"
publish = false

[lib]
name = "nlpdfactor"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[workspace]
