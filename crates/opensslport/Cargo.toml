[package]
name = "opensslport"
version = "0.1.0"
edition = "2021"
description = "AES-CTR, RSA key generation, and random bytes through libssl"
publish = false

[lib]
name = "opensslport"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
openssl = "0.10"
openssl-sys = "0.9"

[workspace]
