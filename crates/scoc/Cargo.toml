[package]
name = "scoc"
version = "0.1.0"
edition = "2021"
description = "SCOC model derivatives ported from deSolve src/ex_SCOC.c"
publish = false

[lib]
name = "scoc"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[workspace]
