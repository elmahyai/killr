[workspace]

[package]
name = "fastmap"
version = "0.1.0"
edition = "2021"
description = "String-to-index map from the fastmap C++ kernel"
publish = false
license = "MIT"

[lib]
name = "fastmap_kernel"
crate-type = ["cdylib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[package.metadata.maturin]
module-name = "fastmap_kernel"
