[package]
name = "readpubkey"
version = "0.1.0"
edition = "2021"
description = "R/openssl read_pubkey PEM, DER, and OpenSSH parsing"
publish = false

[lib]
name = "readpubkey"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
openssl = "0.10"
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[workspace]
