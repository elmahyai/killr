[package]
name = "pan"
version = "0.1.0"
edition = "2021"
description = "Farebrother probability for a weighted sum of chi-squares, from lmtest src/pan.f"
publish = false

[lib]
name = "pan"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

# Own workspace so this crate can be built without editing the repo workspace.
[workspace]
