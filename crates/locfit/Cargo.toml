[workspace]

[package]
name = "locfit"
version = "0.1.0"
edition = "2021"
description = "Direct local regression kernel ported from locfit 1.5-9.12 src/locfit.c, startlf.c, lf_fitfun.c, lf_nbhd.c, weight.c, procv.c, lf_vari.c, frend.c, pcomp.c, family.c, m_eigen.c, m_jacob.c, m_max.c"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "locfit"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
