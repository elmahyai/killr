[package]
name = "lmdif"
version = "0.1.0"
edition = "2021"
description = "MINPACK Levenberg-Marquardt lmdif and lmder from minpack.lm"
publish = false
license = "GPL-3.0-only"

[lib]
name = "lmdif"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[workspace]
