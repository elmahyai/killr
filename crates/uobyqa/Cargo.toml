[workspace]

[package]
name = "uobyqa"
version = "0.1.0"
edition = "2021"
description = "Powell UOBYQA ported from minqa src/uobyqa.f and src/uobyqb.f"
publish = false
license = "GPL-2.0-only"

[lib]
name = "uobyqa"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
