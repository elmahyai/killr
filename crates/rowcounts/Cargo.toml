[package]
name = "rowcounts"
version = "0.1.0"
edition = "2021"
description = "Row counts ported from matrixStats src/rowCounts.c"
publish = false

# Own workspace so this crate can be built without editing the repo workspace.
[workspace]

[lib]
name = "rowcounts"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
