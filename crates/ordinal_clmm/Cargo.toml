[package]
name = "ordinal_clmm"
version = "0.1.0"
edition = "2021"
description = "ordinal clmm random-effect kernels (NRalgv3, getNAGQ, getNGHQ_C, nll) from ordinal 2026.7-26 src/utilityFuns.c"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "ordinal_clmm"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[workspace]
