[workspace]

[package]
name = "survfitaj"
version = "0.1.0"
edition = "2021"
description = "Aalen-Johansen estimates from survival src/survfitaj.c (survfitaj)"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "survfitaj"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
