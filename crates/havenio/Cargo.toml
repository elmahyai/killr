[package]
name = "havenio"
version = "2.5.5"
edition = "2021"
description = "ReadStat I/O from the haven 2.5.5 tarball"
publish = false

[lib]
name = "havenio"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[build-dependencies]
cc = "1"
bindgen = "0.72"

# Own workspace so this crate can be built without editing the repo workspace.
[workspace]
