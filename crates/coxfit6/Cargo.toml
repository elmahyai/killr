[workspace]

[package]
name = "coxfit6"
version = "0.1.0"
edition = "2021"
description = "Cox partial likelihood fit from survival src/coxfit6.c"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "coxfit6"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
