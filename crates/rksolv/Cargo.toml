[package]
name = "rksolv"
version = "0.1.0"
edition = "2021"
description = "deSolve Runge-Kutta integrators from src/rk_auto.c and rk_fixed.c"
publish = false

[lib]
name = "rksolv"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[workspace]
