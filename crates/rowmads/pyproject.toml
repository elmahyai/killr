[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "rowmads"
version = "0.1.0"
description = "Row and column median absolute deviations ported from matrixStats src/rowMads.c"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "rowmads"
