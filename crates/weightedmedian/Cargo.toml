[package]
name = "weightedmedian"
version = "0.1.0"
edition = "2021"
description = "Weighted median ported from matrixStats src/weightedMedian.c"
publish = false

[lib]
name = "weightedmedian"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

# Own workspace so this crate can build without being added to the repo workspace.
[workspace]
