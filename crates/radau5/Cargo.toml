[package]
name = "radau5"
version = "0.1.0"
edition = "2021"
description = "RADAU5 implicit Runge-Kutta from deSolve src/radau5.f"
publish = false
license = "BSD-3-Clause"

[lib]
name = "radau5"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[workspace]
