[package]
name = "leaps"
version = "0.1.0"
edition = "2021"
description = "Leaps-and-bounds exhaustive subset search ported from leaps 3.2 src/leaps.f"
publish = false

[lib]
name = "leaps"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[workspace]
