[workspace]

[package]
name = "survreg7"
version = "0.1.0"
edition = "2021"
description = "Penalized parametric survival fit (survival survpenal.fit) ported from survreg7.c, survpenal.c, survregc1.c, and coxpenal.df"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "survreg7"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = { version = "0.30" }
