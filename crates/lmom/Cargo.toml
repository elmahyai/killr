[package]
name = "lmom"
version = "0.1.0"
edition = "2021"
description = "L-moment kernels ported from lmom 3.3 src/lmoments.f and src/samlm.f"
publish = false

[lib]
name = "lmom_kernel"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[workspace]
