[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "nlmerecalc"
version = "0.1.0"
description = "nlme correlation recalc kernels (symm, natural, compound symmetry, AR1)"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "nlmerecalc"
