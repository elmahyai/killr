[package]
name = "nlmerecalc"
version = "0.1.0"
edition = "2021"
description = "nlme corStruct.c correlation recalc kernels"
publish = false

[lib]
name = "nlmerecalc"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

