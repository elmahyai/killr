[package]
name = "pkcs12parse"
version = "0.1.0"
edition = "2021"
description = "R_parse_pkcs12 from openssl src/pkcs12.c"
publish = false

[lib]
name = "pkcs12parse"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
foreign-types-shared = "0.1"
openssl = "0.10"
openssl-sys = "0.9"
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }

[workspace]
