[package]
name = "rowlogsumexps"
version = "0.1.0"
edition = "2021"
description = "Row and column log-sum-exp ported from matrixStats src/rowLogSumExp.c"
publish = false

# Own workspace so this crate can be built without editing the repo workspace.
[workspace]

[lib]
name = "rowlogsumexps"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
logsumexp = { path = "../logsumexp", default-features = false }
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
