[project]
name = "rowlogsumexps"
version = "0.1.0"
description = "Row and column log-sum-exp ported from matrixStats src/rowLogSumExp.c"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "rowlogsumexps"
