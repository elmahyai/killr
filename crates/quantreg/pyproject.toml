[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "quantreg_kernel"
version = "0.1.0"
description = "Kernels of R package quantreg 6.1 (rqfnb, pfnb, pwxy, bootnp) ported to Rust"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "quantreg_kernel"
