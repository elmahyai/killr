[workspace]

[package]
name = "quantreg_kernel"
version = "0.1.0"
edition = "2021"
description = "Kernels of R package quantreg 6.1 ported from src/rqfnb.f, pfnb.f, pwxy.f, grexp.f and mcmb.c: rqfnb, pfnb, pwxy and bootnp, with R's Mersenne-Twister and exp_rand"
publish = false
license = "GPL-3.0-or-later"

[lib]
name = "quantreg_kernel"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
