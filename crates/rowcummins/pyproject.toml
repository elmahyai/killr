[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "rowcummins"
version = "0.1.0"
description = "Cumulative row and column minima ported from matrixStats src/rowCummins.c"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "rowcummins"
