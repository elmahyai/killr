[workspace]

[package]
name = "coxexact"
version = "0.1.0"
edition = "2021"
description = "Exact conditional Cox/clogit fit from survival src/coxexact.c"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "coxexact"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
