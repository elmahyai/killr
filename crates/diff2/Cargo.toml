[workspace]

[package]
name = "diff2"
version = "0.1.0"
edition = "2021"
description = "Lagged differences ported from matrixStats src/diff2.c"
publish = false

[lib]
name = "diff2"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
