[package]
name = "tzdb"
version = "0.1.0"
edition = "2021"
description = "Time zone database names and version from the tzdb text files"
publish = false

[workspace]

[lib]
name = "tzdb"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
