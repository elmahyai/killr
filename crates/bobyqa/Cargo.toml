[workspace]

[package]
name = "bobyqa"
version = "0.1.0"
edition = "2021"
description = "Powell BOBYQA ported from minqa src/bobyqa.f and src/bobyqb.f"
publish = false
license = "GPL-2.0-only"

[lib]
name = "bobyqa"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
