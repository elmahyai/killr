[package]
name = "binmeans"
version = "0.1.0"
edition = "2021"
description = "Bin means ported from matrixStats src/binMeans.c"
publish = false

[lib]
name = "binmeans"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }

[workspace]
