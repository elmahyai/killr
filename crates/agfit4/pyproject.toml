[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "agfit4"
version = "0.1.0"
description = "Counting-process Cox partial likelihood ported from survival agfit4.c and agmart3.c"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "agfit4"
