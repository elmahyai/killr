[workspace]

[package]
name = "agfit4"
version = "0.1.0"
edition = "2021"
description = "Counting-process Cox partial likelihood from survival src/agfit4.c and agmart3.c"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "agfit4"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["extension-module"] }
numpy = { version = "0.30", optional = true }
