[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igraph"
version = "2.3.4"
description = "Python translation of the R package igraph"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["igraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
