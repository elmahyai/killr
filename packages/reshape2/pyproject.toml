[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reshape2"
version = "1.4.5"
description = "Python translation of the R package reshape2"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["reshape2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
