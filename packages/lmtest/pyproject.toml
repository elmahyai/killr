[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmtest"
version = "0.1.0"
description = "Python translation of the R package lmtest"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lmtest*"]
