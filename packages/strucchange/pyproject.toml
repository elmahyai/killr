[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strucchange"
version = "1.6.0"
description = "Python translation of the R package strucchange 1.6-0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["strucchange*"]
