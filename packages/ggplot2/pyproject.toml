[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ggplot2"
version = "4.0.3"
description = "Python translation of the R package ggplot2"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["ggplot2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
