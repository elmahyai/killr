[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prettyunits"
version = "1.2.0"
description = "Python translation of the R package prettyunits"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["prettyunits*"]

[tool.setuptools.package-data]
prettyunits = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
