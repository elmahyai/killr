[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moments"
version = "0.14.1"
description = "Python translation of the R package moments"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["moments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
