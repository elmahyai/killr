[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Matrix"
version = "1.7-6"
description = "Python translation of the R package Matrix"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["Matrix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
