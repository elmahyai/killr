[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucminf"
version = "1.2.3"
description = "Python translation of the R package ucminf"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ucminf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
