[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ellipse"
version = "0.5.0"
description = "Python translation of the R package ellipse"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ellipse*"]
