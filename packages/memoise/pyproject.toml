[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoise"
version = "0.1.0"
description = "Python translation of the R package memoise"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["memoise*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
