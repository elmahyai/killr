[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iterators"
version = "1.0.14"
description = "Python translation of the R package iterators"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["iterators*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
