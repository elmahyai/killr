[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digest"
version = "0.6.39"
description = "Python translation of the R package digest"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["digest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
