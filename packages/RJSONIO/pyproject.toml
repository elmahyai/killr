[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rjsonio"
version = "2.0.5"
description = "Python translation of the R package RJSONIO"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["rjsonio*"]
