[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tseries"
version = "0.10.63"
description = "Python translation of the R package tseries"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"

[tool.setuptools.packages.find]
where = ["."]
include = ["tseries*"]
