[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r-yaml"
version = "0.1.0"
description = "Python translation of the R package yaml"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["r_yaml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
