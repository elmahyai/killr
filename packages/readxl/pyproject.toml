[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readxl"
version = "1.5.0.1"
description = "Python translation of the R package readxl"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["readxl*"]

[tool.setuptools.package-data]
readxl = ["extdata/*"]
