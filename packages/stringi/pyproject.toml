[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stringi"
version = "0.1.0"
description = "Python translation of the R package stringi"
requires-python = ">=3.11"
dependencies = ["PyICU"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stringi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
