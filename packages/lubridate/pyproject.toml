[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lubridate"
version = "0.1.0"
description = "Python translation of the R package lubridate"
requires-python = ">=3.11"
dependencies = ["numpy", "timechange"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lubridate*"]
