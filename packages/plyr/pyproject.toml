[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plyr"
version = "1.8.9"
description = "Python translation of the R package plyr"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["plyr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
