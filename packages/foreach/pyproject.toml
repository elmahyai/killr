[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foreach"
version = "1.5.2"
description = "Python translation of the R package foreach"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["foreach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
