[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleboot"
version = "0.1.0"
description = "Python translation of the R package simpleboot"
requires-python = ">=3.11"
dependencies = ["numpy", "matplotlib", "boot"]

[tool.setuptools.packages.find]
where = ["."]
include = ["simpleboot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
