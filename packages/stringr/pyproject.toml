[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stringr"
version = "0.1.0"
description = "Python translation of the R package stringr"
requires-python = ">=3.11"
dependencies = ["stringi", "glue", "magrittr", "cli", "lifecycle", "vctrs"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stringr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
