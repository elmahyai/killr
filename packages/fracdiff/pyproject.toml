[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fracdiff"
version = "1.5.4"
description = "Python translation of the R package fracdiff"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["fracdiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
