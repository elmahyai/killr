[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vctrs"
version = "0.1.0"
description = "Python translation of the httr2 slice of the R package vctrs"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["vctrs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
