[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slam"
version = "0.1.56"
description = "Python translation of the R package slam"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["slam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
