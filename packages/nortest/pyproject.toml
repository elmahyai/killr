[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nortest"
version = "1.0.4"
description = "Python translation of the R package nortest"
requires-python = ">=3.11"
dependencies = ["scipy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nortest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
