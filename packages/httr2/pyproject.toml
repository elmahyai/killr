[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "httr2"
version = "1.3.0"
description = "Python translation of the R package httr2"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["httr2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
