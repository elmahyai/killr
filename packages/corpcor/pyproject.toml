[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpcor"
version = "1.6.10"
description = "Python translation of the R package corpcor"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["corpcor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
