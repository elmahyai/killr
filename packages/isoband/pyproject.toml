[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isoband"
version = "0.3.0"
description = "Python translation of the R package isoband"
requires-python = ">=3.11"
dependencies = ["numpy", "isoband-kernel"]

[tool.setuptools.packages.find]
where = ["."]
include = ["isoband*"]
