[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dplyr"
version = "1.2.1"
description = "Python translation of the R package dplyr"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["dplyr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
