[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "htmltools"
version = "0.5.9"
description = "Python translation of the R package htmltools"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["htmltools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
