[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ca"
version = "0.72"
description = "Python translation of the R package ca"
requires-python = ">=3.11"
dependencies = ["numpy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ca*"]
