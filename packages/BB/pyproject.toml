[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "BB"
version = "2026.1.0"
description = "Python translation of the R package BB"
requires-python = ">=3.11"
dependencies = ["numpy", "numDeriv", "quadprog"]

[tool.setuptools.packages.find]
where = ["."]
include = ["BB*"]
