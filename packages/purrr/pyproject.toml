[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purrr"
version = "1.2.2"
description = "Python translation of the R package purrr"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["purrr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
