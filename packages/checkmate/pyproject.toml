[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checkmate"
version = "2.3.4"
description = "Python translation of the R package checkmate"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["checkmate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
