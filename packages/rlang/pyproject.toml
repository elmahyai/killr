[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlang"
version = "0.1.0"
description = "Python translation of the httr2 slice of the R package rlang"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["rlang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
