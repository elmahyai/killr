[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haven"
version = "2.5.5"
description = "Python translation of the R package haven"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["haven*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
