[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mass"
version = "0.1.0"
description = "Partial Python translation of the R package MASS"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mass*"]

[tool.setuptools.package-data]
mass = ["geyser.csv", "data/*.csv", "data/*.json"]
