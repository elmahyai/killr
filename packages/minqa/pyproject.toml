[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minqa"
version = "1.2.8"
description = "Python translation of the R package minqa"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["minqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
