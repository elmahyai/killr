[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numderiv"
version = "2016.8.1.1"
description = "Python translation of the R package numDeriv"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["numderiv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
