[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "permute"
version = "0.9.10"
description = "Python translation of the R package permute"
requires-python = ">=3.11"
dependencies = ["numpy"]
[tool.setuptools.packages.find]
where = ["."]
include = ["permute*"]
