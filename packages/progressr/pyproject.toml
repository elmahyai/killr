[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "progressr"
version = "0.1.0"
description = "Python translation of the R package progressr"
requires-python = ">=3.11"
dependencies = ["digest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["progressr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
