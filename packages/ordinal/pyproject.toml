[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordinal"
version = "2026.7.26"
description = "Python translation of the R package ordinal"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ordinal*"]
