[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cli"
version = "0.1.0"
description = "Python translation of the R package cli"
requires-python = ">=3.11"
dependencies = ["glue", "digest", "regex"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]

[tool.setuptools.package-data]
cli = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
