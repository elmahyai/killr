[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidyr"
version = "1.3.2"
description = "Python translation of the R package tidyr"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["tidyr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
