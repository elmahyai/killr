[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pracma"
version = "0.1.0"
description = "Python translation of the R package pracma"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pracma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
