[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fansi"
version = "1.0.7"
description = "Python translation of the R package fansi"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["fansi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
