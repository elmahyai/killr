[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "FNN"
version = "0.1.0"
description = "Python translation of the R package FNN"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["FNN*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
