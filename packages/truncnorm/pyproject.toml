[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truncnorm"
version = "0.1.0"
description = "Python translation of the R package truncnorm"
requires-python = ">=3.11"
dependencies = ["scipy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["truncnorm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
