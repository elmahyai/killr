[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrixstats"
version = "0.1.0"
description = "Python translation of the R package matrixStats"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["matrixstats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
