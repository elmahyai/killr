[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Rdpack"
version = "2.6.6"
description = "Python translation of the R package Rdpack"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["Rdpack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
