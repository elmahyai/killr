[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slider"
version = "0.3.3"
description = "Python translation of the R package slider"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["slider*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
