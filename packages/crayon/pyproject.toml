[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crayon"
version = "1.5.3"
description = "Python translation of the R package crayon"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["crayon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
