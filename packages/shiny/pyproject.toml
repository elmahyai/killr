[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiny"
version = "1.14.0"
description = "Python translation of the R package shiny"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["shiny*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
