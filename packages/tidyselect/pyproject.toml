[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidyselect"
version = "1.2.1"
description = "Python translation of the R package tidyselect"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["tidyselect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
