[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelr"
version = "0.1.11"
description = "Python translation of the R package modelr"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["modelr*"]

[tool.setuptools.package-data]
modelr = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
