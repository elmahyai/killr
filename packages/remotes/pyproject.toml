[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remotes"
version = "0.1.0"
description = "Python translation of the R package remotes"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["remotes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
