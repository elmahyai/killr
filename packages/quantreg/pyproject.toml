[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantreg"
version = "0.1.0"
description = "Python translation of the R package quantreg"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "boot"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantreg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
