[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pillar"
version = "1.11.1"
description = "Python translation of the R package pillar"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["pillar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
