[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scales"
version = "1.4.0"
description = "Python translation of the R package scales"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["scales*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
