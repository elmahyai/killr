[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandwich"
version = "3.1-3"
description = "Python translation of the R package sandwich"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sandwich*"]

[tool.setuptools.package-data]
sandwich = ["data/*.json"]
