[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sf"
version = "1.1-3"
description = "Python translation of the R package sf"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["sf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
