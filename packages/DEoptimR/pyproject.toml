[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DEoptimR"
version = "1.2.2"
description = "Python translation of the R package DEoptimR"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["DEoptimR*"]
