[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "RColorBrewer"
version = "1.1-3"
description = "Python translation of the R package RColorBrewer"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["RColorBrewer*"]
