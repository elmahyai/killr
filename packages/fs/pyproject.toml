[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fs"
version = "0.1.0"
description = "Python translation of the R package fs"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["fs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
