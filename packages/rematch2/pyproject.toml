[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rematch2"
version = "0.1.0"
description = "Python translation of the R package rematch2"
requires-python = ">=3.11"
dependencies = ["tibble"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rematch2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
