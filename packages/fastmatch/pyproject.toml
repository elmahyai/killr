[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmatch"
version = "1.1.8"
description = "Python translation of the R package fastmatch"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastmatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
