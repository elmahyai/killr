[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "httr"
version = "1.4.9"
description = "Python translation of the R package httr"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["httr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
