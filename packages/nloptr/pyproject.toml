[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nloptr"
version = "2.2.1"
description = "Python translation of the R package nloptr"
requires-python = ">=3.11"
dependencies = ["nlopt==2.10.0", "numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nloptr*"]

[tool.setuptools.package-data]
nloptr = ["default_options.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
