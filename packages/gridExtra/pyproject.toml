[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridExtra"
version = "2.3.1"
description = "Python translation of the R package gridExtra"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["gridExtra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
