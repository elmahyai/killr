[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knitr"
version = "1.52"
description = "Python translation of the R package knitr"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["knitr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
