[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readr"
version = "0.1.0"
description = "Python translation of the R package readr"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["readr*"]

[tool.setuptools.package-data]
readr = ["date_symbols.json", "extdata/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
