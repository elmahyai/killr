[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fontawesome"
version = "0.5.3"
description = "Python translation of the R package fontawesome"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["fontawesome*"]

[tool.setuptools.package-data]
fontawesome = ["*.json", "*.css"]
