[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "killplot"
version = "0.1.0"
description = "Chart functions that Matplotlib does not already provide"
requires-python = ">=3.11"
dependencies = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["killplot*"]
