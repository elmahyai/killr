<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="killr logo">
  <defs>
    <linearGradient id="killr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="killr-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="184" height="184" rx="46" fill="url(#killr-bg)"/>
  <rect x="8" y="8" width="184" height="92" rx="46" fill="url(#killr-glow)"/>
  <!-- the letter R, drawn as strokes so it renders the same everywhere -->
  <g fill="none" stroke="#ffffff" stroke-width="20" stroke-linejoin="round">
    <path d="M72 46 V154"/>
    <path d="M72 46 H106 A34 34 0 0 1 106 114 H72"/>
    <path d="M104 114 L138 154"/>
  </g>
  <!-- the kill: a strike through the R, with a dark halo so it reads on any background -->
  <line x1="46" y1="158" x2="158" y2="42" stroke="#0b0d17" stroke-opacity="0.35" stroke-width="28" stroke-linecap="round"/>
  <line x1="46" y1="158" x2="158" y2="42" stroke="#ff5c8a" stroke-width="14" stroke-linecap="round"/>
</svg>
